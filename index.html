<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Chain Reaction — Weakest Link Party Game</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<style>
:root{
  --bg:#0a0e1a;
  --panel:#121829;
  --panel-2:#1a2138;
  --line:#2a3350;
  --gold:#e8b23d;
  --gold-dim:#8a6a24;
  --red:#e5484d;
  --green:#3fa66c;
  --text:#f1f3f6;
  --muted:#8a93a6;
  --blue:#4f8ff7;
  --radius:14px;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:radial-gradient(ellipse at top, #131a30 0%, var(--bg) 55%);
  color:var(--text);
  font-family:'Inter',sans-serif;
  min-height:100vh;
  -webkit-tap-highlight-color:transparent;
}
h1,h2,h3,.display{font-family:'Oswald',sans-serif;}
button{font-family:'Inter',sans-serif;cursor:pointer;border:none;}
input,select,textarea{font-family:'Inter',sans-serif;}
#app{min-height:100vh;display:flex;flex-direction:column;}

/* ---------- Landing ---------- */
.landing{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:32px;text-align:center;}
.landing .brand{font-family:'Oswald',sans-serif;font-weight:600;font-size:clamp(40px,9vw,72px);letter-spacing:0.5px;margin:0;line-height:1;background:linear-gradient(180deg,#fff, var(--gold) 140%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;}
.landing .brand span{color:var(--gold);-webkit-text-fill-color:var(--gold);}
.landing .tag{color:var(--muted);font-size:16px;margin:10px 0 40px;max-width:440px;}
.landing-btns{display:flex;gap:16px;flex-wrap:wrap;justify-content:center;}
.big-btn{padding:18px 34px;border-radius:12px;font-size:17px;font-weight:600;min-width:200px;transition:transform .15s ease;}
.big-btn:active{transform:scale(0.97);}
.big-btn.gold{background:linear-gradient(180deg,#f3c463,var(--gold));color:#20150a;}
.big-btn.gold:disabled{background:var(--panel-2);color:var(--muted);cursor:not-allowed;}
.big-btn.ghost{background:var(--panel-2);color:var(--text);border:1px solid var(--line);}
.setup-card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:28px;max-width:400px;width:100%;text-align:left;}
.setup-card label{display:block;font-size:13px;color:var(--muted);margin:16px 0 6px;}
.setup-card input,.setup-card select{width:100%;padding:12px 14px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--text);font-size:16px;}
.setup-card input:focus,.setup-card select:focus{outline:2px solid var(--blue);}
.back-link{background:none;color:var(--muted);font-size:14px;padding:6px 0;margin-bottom:10px;align-self:flex-start;}
.error-box{background:rgba(229,72,77,0.12);border:1px solid var(--red);color:#ffb3b5;padding:14px 16px;border-radius:10px;margin:14px 0;font-size:14px;text-align:left;}

/* ---------- Generic layout ---------- */
.main-compact{max-width:760px;margin:0 auto;width:100%;padding:10px 18px 26px;}
.ctrl-wrap{max-width:520px;margin:0 auto;width:100%;padding:12px 16px 26px;}
.top-bar{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line);flex-wrap:wrap;gap:10px;margin-bottom:10px;}
.top-bar .room-pill{background:var(--panel-2);border:1px solid var(--gold-dim);color:var(--gold);font-family:'Oswald',sans-serif;font-size:14px;padding:5px 12px;border-radius:20px;letter-spacing:2px;}
.stat-strip{display:flex;gap:8px;flex-wrap:wrap;}
.stat-chip{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:6px 12px;font-size:12px;color:var(--muted);}
.stat-chip b{color:var(--text);font-family:'Oswald',sans-serif;font-size:15px;display:block;}
.stat-chip.gold b{color:var(--gold);}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;margin-bottom:12px;}
.panel h3{margin:0 0 10px;font-size:13px;font-weight:500;color:var(--muted);letter-spacing:0.3px;}

/* big shared timer */
.big-timer{font-family:'Oswald',sans-serif;font-size:clamp(46px,11vw,68px);text-align:center;color:var(--blue);line-height:1;margin:2px 0 12px;font-variant-numeric:tabular-nums;}
.big-timer.low{color:var(--red);}

/* pre-round countdown */
.countdown-block{text-align:center;padding:22px 0;}
.countdown-label{color:var(--muted);font-size:15px;margin-bottom:6px;}
.big-countdown{font-family:'Oswald',sans-serif;font-size:clamp(64px,16vw,110px);color:var(--gold);line-height:1;font-variant-numeric:tabular-nums;}
.countdown-sub{color:var(--blue);font-size:16px;margin-top:10px;}

/* compact horizontal chain ladder (used everywhere) */
.ladder-h{display:flex;gap:5px;flex-wrap:wrap;justify-content:center;margin:8px 0;}
.rung-h{padding:5px 9px;border-radius:6px;background:var(--panel-2);color:var(--muted);font-family:'Oswald',sans-serif;font-size:12px;transition:.2s;}
.rung-h.climbed{background:rgba(232,178,61,0.14);color:#e0c98a;}
.rung-h.current{background:linear-gradient(180deg,#f3c463,var(--gold));color:#20150a;font-size:15px;font-weight:700;padding:6px 13px;}
.bank-total{margin-top:10px;text-align:center;padding:12px;border-radius:10px;background:var(--panel-2);}
.bank-total .amt{font-family:'Oswald',sans-serif;font-size:26px;color:var(--gold);}
.bank-total .lbl{font-size:11px;color:var(--muted);}

/* stage / question display */
.stage{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;}
.stage.compact{padding:6px 0 4px;}
.stage .q-label{font-size:12px;color:var(--muted);margin-bottom:8px;}
.stage .q-text{font-size:clamp(20px,3vw,30px);font-weight:600;line-height:1.3;max-width:560px;margin:0 auto;}
.stage .a-text{margin-top:14px;font-family:'Oswald',sans-serif;font-size:20px;color:var(--green);text-align:center;}
.ctrl-asked{font-family:'Oswald',sans-serif;font-size:clamp(20px,3vw,30px);font-weight:600;text-align:center;margin-bottom:10px;}
.action-row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:16px;}
.act-btn{padding:14px 22px;border-radius:10px;font-size:15px;font-weight:600;}
.act-btn.correct{background:var(--green);color:#06210f;}
.act-btn.incorrect{background:var(--red);color:#2a0709;}
.act-btn.primary{background:var(--blue);color:#06122a;}
.act-btn.bank{background:linear-gradient(180deg,#f3c463,var(--gold));color:#20150a;}
.act-btn.neutral{background:var(--panel-2);color:var(--text);border:1px solid var(--line);}
.act-btn:disabled{opacity:0.35;cursor:not-allowed;}
.full-btn{width:100%;padding:15px;border-radius:12px;font-size:15px;font-weight:600;margin-top:8px;}

/* roster / chips */
.roster{display:flex;flex-direction:column;gap:8px;}
.chip{display:flex;align-items:center;justify-content:space-between;padding:9px 12px;border-radius:10px;background:var(--panel-2);border:1px solid transparent;font-size:13px;gap:8px;}
.chip.selected{border-color:var(--blue);background:rgba(79,143,247,0.12);}
.chip .sub{font-size:11px;color:var(--muted);}
.dot{width:7px;height:7px;border-radius:50%;background:var(--green);display:inline-block;margin-right:6px;}
.dot.off{background:var(--muted);}
.kick-btn{background:none;color:var(--muted);font-size:15px;padding:2px 8px;border-radius:6px;}
.kick-btn:active{color:var(--red);}

.log{margin-top:12px;font-size:11px;color:var(--muted);display:flex;flex-direction:column;gap:5px;max-height:120px;overflow-y:auto;}
.banner{background:rgba(232,178,61,0.15);border:1px solid var(--gold-dim);color:var(--gold);padding:10px 14px;border-radius:10px;font-size:14px;margin-bottom:12px;text-align:center;}

/* question bank viewer */
.qbank-list{max-height:280px;overflow-y:auto;display:flex;flex-direction:column;gap:8px;padding-right:4px;margin-top:10px;}
.qbank-row{display:flex;gap:10px;background:var(--panel-2);padding:8px 10px;border-radius:8px;font-size:13px;}
.qbank-num{color:var(--muted);min-width:28px;}
.qbank-q{color:var(--text);}
.qbank-a{color:var(--green);font-size:12px;margin-top:2px;}

/* voting */
.vote-grid{display:flex;flex-direction:column;gap:8px;max-width:420px;margin:0 auto;}
.vote-row{display:flex;justify-content:space-between;align-items:center;background:var(--panel-2);padding:10px 14px;border-radius:10px;font-size:14px;}
.vote-row .yes{color:var(--green);}
.vote-row .no{color:var(--muted);}

/* elimination */
.elim-card{text-align:center;padding:22px;}
.elim-card .name{font-family:'Oswald',sans-serif;font-size:34px;color:var(--red);margin:10px 0;}
.tally{display:flex;flex-direction:column;gap:6px;max-width:340px;margin:16px auto;}
.tally .r{display:flex;justify-content:space-between;background:var(--panel-2);padding:8px 12px;border-radius:8px;font-size:14px;}

/* shootout */
.duel{display:flex;justify-content:center;gap:34px;flex-wrap:wrap;margin:14px 0;}
.duel-side{text-align:center;padding:10px 16px;border-radius:10px;transition:.2s;}
.duel-side .nm{font-family:'Oswald',sans-serif;font-size:20px;}
.duel-side.active{box-shadow:0 0 0 2px var(--gold-dim),0 0 30px 6px rgba(232,178,61,0.35);background:rgba(232,178,61,0.06);}
.duel-side.active .nm{color:var(--gold);}
.kicks{display:flex;gap:6px;justify-content:center;margin-top:10px;}
.kick{width:24px;height:24px;border-radius:50%;background:var(--panel-2);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:13px;}
.kick.hit{background:var(--green);color:#06210f;border-color:var(--green);}
.kick.miss{background:var(--red);color:#2a0709;border-color:var(--red);}

/* podiums (audience-facing main screen) */
.podium-row{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;padding:10px 0 4px;}
.podium{position:relative;display:flex;flex-direction:column;align-items:center;padding:10px 14px 0;min-width:88px;animation:podiumIn .3s ease;}
@keyframes podiumIn{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}
.podium-name{font-family:'Oswald',sans-serif;font-size:15px;white-space:nowrap;z-index:2;}
.podium-acc{font-size:11px;color:var(--muted);margin-top:2px;z-index:2;}
.podium-base{width:100%;height:12px;margin-top:8px;background:linear-gradient(180deg,var(--panel-2),var(--line));border-radius:4px 4px 0 0;border-top:2px solid var(--line);}
.podium.spotlight .podium-name{color:var(--gold);font-size:18px;}
.podium.spotlight .podium-base{background:linear-gradient(180deg,#3a2f10,var(--gold-dim));border-top-color:var(--gold);}
.podium.spotlight{box-shadow:0 0 0 1px var(--gold-dim);border-radius:10px;}
.spotlight-beam{position:absolute;top:-26px;left:50%;width:80px;height:80px;transform:translateX(-50%);background:radial-gradient(ellipse at top, rgba(232,178,61,0.45), transparent 70%);pointer-events:none;z-index:1;}

/* keyboard hint */
.kbd{display:inline-block;margin-left:8px;padding:1px 7px;border-radius:4px;background:rgba(0,0,0,0.28);font-size:11px;font-family:monospace;letter-spacing:0.5px;}

/* game over */
.gameover{text-align:center;padding:30px 20px;}
.gameover .trophy{font-size:56px;}
.gameover .winner{font-family:'Oswald',sans-serif;font-size:38px;color:var(--gold);margin:6px 0 6px;}
.standings{max-width:360px;margin:0 auto;display:flex;flex-direction:column;gap:6px;}
.standings .r{display:flex;justify-content:space-between;background:var(--panel-2);padding:9px 14px;border-radius:8px;font-size:14px;}

/* player screen */
.player-wrap{max-width:520px;margin:0 auto;width:100%;padding:16px;}
.p-header{text-align:center;margin-bottom:12px;}
.p-header .rc{color:var(--gold);font-family:'Oswald',sans-serif;letter-spacing:3px;font-size:14px;}
.p-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px;}
.p-stat{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px;text-align:center;}
.p-stat b{display:block;font-family:'Oswald',sans-serif;font-size:22px;}
.p-stat span{font-size:11px;color:var(--muted);}
.turn-flag{text-align:center;padding:16px;border-radius:12px;font-size:17px;font-weight:700;margin-bottom:14px;}
.turn-flag.yours{background:rgba(232,178,61,0.18);color:var(--gold);border:1px solid var(--gold-dim);}
.turn-flag.theirs{background:var(--panel-2);color:var(--muted);border:1px solid var(--line);}
.center-msg{text-align:center;color:var(--muted);padding:30px 20px;font-size:15px;}
.spectator-tag{background:var(--panel-2);color:var(--muted);text-align:center;padding:10px;border-radius:10px;margin-bottom:14px;font-size:13px;}
.footer-note{text-align:center;color:var(--muted);font-size:11px;padding:14px;}
</style>
</head>

/* ============================== HELPERS ============================== */
function $(sel){ return document.querySelector(sel); }
function uid(){ return Math.random().toString(36).slice(2,9); }
function fmtMoney(n){ return '$' + n.toLocaleString(); }
function shuffle(arr){
  for (var i = arr.length - 1; i > 0; i--){
    var j = Math.floor(Math.random() * (i + 1));
    var t = arr[i]; arr[i] = arr[j]; arr[j] = t;
  }
  return arr;
}
function genRoomCode(){
  var chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ';
  var s = '';
  for (var i = 0; i < 4; i++) s += chars[Math.floor(Math.random() * chars.length)];
  return s;
}
function accuracyOf(p){
  var total = p.correct + p.incorrect;
  if (total === 0) return null;
  return Math.round((p.correct / total) * 100);
}
function esc(s){
  return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}
function fmtClock(ms){
  var s = Math.max(0, Math.ceil(ms/1000));
  var m = Math.floor(s/60);
  var r = s%60;
  return m + ':' + (r<10?'0':'') + r;
}

    if (inQuotes){
      if (c === '"'){
        if (text[i+1] === '"'){ field += '"'; i += 2; continue; }
        inQuotes = false; i++; continue;
      }
      field += c; i++; continue;
    } else {
      if (c === '"'){ inQuotes = true; i++; continue; }
      if (c === ','){ row.push(field); field = ''; i++; continue; }
      if (c === '\n'){ row.push(field); rows.push(row); row = []; field = ''; i++; continue; }
      field += c; i++; continue;
    }
  }
  row.push(field);
  rows.push(row);

  var out = [];
  rows.forEach(function(r, idx){
    var q = (r[0] || '').trim();
    var a = (r[1] || '').trim();
    if (!q || !a) return;
    if (idx === 0 && /^question$/i.test(q) && /^answer$/i.test(a)) return; // skip a header row
    out.push([q, a]);
  });
  return out;
}
function parseCustomQuestions(text){
  text = (text || '').trim();
  if (!text) return [];
  if (text[0] === '['){
    try{
      var arr = JSON.parse(text);
      if (Array.isArray(arr)){
        var fromJson = [];
        arr.forEach(function(item){
          if (Array.isArray(item) && item[0] && item[1]){
            fromJson.push([String(item[0]).trim(), String(item[1]).trim()]);
          } else if (item && typeof item === 'object'){
            var q = item.q || item.question;
            var a = item.a || item.answer;
            if (q && a) fromJson.push([String(q).trim(), String(a).trim()]);
          }
        });
        if (fromJson.length) return fromJson;
      }
    } catch(e){ /* not valid JSON, fall through to line parsing */ }
  }
  var lines = text.split('\n');
  var out = [];
  lines.forEach(function(line){
    line = line.trim();
    if (!line) return;
    var idx = line.indexOf('|');
    if (idx === -1) return;
    var q = line.slice(0, idx).trim();
    var a = line.slice(idx + 1).trim();
    if (q && a) out.push([q, a]);
  });
  return out;
}

/* ============================== HOST NETWORKING ============================== */
function hostCreateRoom(durationSeconds){
  role = 'host';
  H = newHostState();
  H.roundDuration = durationSeconds;
  H.timer.duration = durationSeconds;
  H.roomCode = genRoomCode();
  hostConns = {}; hostControllerConns = [];
  try{
    peer = new Peer('wlink-' + H.roomCode, {debug:0});
  } catch(e){
    H.error = 'Could not start a connection. Try again.';
    render();
    return;
  }
  peer.on('open', function(){ H.ready = true; render(); });
  peer.on('connection', function(conn){
    conn.on('data', function(data){ handleIncomingHostMessage(conn, data); });
    conn.on('close', function(){ handleHostSideDisconnect(conn); });
  });
  peer.on('disconnected', function(){ try{ peer.reconnect(); }catch(e){} });
  peer.on('error', function(err){
    H.error = (err && err.type === 'unavailable-id')
      ? 'That room code is already in use — try again.'
      : 'Connection error (' + (err && err.type) + '). Check your internet and try again.';
    render();
  });
  render();
}

function handleIncomingHostMessage(conn, msg){
  if (!H) return;

  if (msg.type === 'joinController'){
    if (hostControllerConns.indexOf(conn) === -1) hostControllerConns.push(conn);
    conn.send({type:'welcomeController', roomCode:H.roomCode});
    conn.send({type:'controllerState', state: sanitizeForController()});
    return;
  }

  if (msg.type === 'control'){
    if (hostControllerConns.indexOf(conn) === -1) return; // only accept control messages from a registered controller
    var fn = CONTROL_ACTIONS[msg.action];
    if (fn) fn(msg.arg, conn);
    return;
  }

  if (msg.type === 'join'){
    var incomingName = (msg.name || 'Player').toString().trim().slice(0,18) || 'Player';
    var p = null;
    if (msg.rejoinId){
      p = H.players.filter(function(pl){ return pl.id === msg.rejoinId; })[0] || null;
    }
    if (!p){
      // No session id (new device/session) but the name matches someone currently OFFLINE:
      // treat this as that player reconnecting and keep all their stats/alive status.
      p = H.players.filter(function(pl){
        return pl.connected === false && pl.name.toLowerCase() === incomingName.toLowerCase();
      })[0] || null;
    }
    if (p){
      var wasOffline = !p.connected;
      p.connected = true;
      hostConns[p.id] = conn;
      conn.send({type:'welcome', playerId:p.id, roomCode:H.roomCode});
      pushLog(p.name + (wasOffline ? ' reconnected' : ' joined'));
      broadcastState(); render();
      return;
    }
    if (H.phase !== 'lobby'){
      conn.send({type:'denied', reason:'The game is already in progress. Ask the host to start a new room.'});
      return;
    }
    var finalName = incomingName, n = 2;
    while (H.players.some(function(pl){ return pl.name.toLowerCase() === finalName.toLowerCase(); })){
      finalName = incomingName + ' ' + n; n++;
    }
    var np = {id:uid(), name:finalName, alive:true, correct:0, incorrect:0, connected:true};
    H.players.push(np);
    hostConns[np.id] = conn;
    conn.send({type:'welcome', playerId:np.id, roomCode:H.roomCode});
    pushLog(np.name + ' joined');
    broadcastState(); render();
    return;
  }

  // Remaining message types require an already-known connected player
  var player = null;
  for (var pid in hostConns){ if (hostConns[pid] === conn) player = H.players.filter(function(pl){return pl.id===pid;})[0]; }
  if (!player) return;

  if (msg.type === 'vote'){
    if (H.phase !== 'voting' || !player.alive) return;
    H.votes[player.id] = msg.targetId;
    broadcastState(); render();
  } else if (msg.type === 'callBank'){
    if (H.phase === 'playing' && H.currentAskedId === player.id){
      doBankChain(player.name);
    }
  } else if (msg.type === 'rename'){
    if (H.phase !== 'lobby') return;
    var newName = (msg.newName || '').toString().trim().slice(0,18);
    if (!newName) return;
    var conflict = H.players.some(function(pl){ return pl.id !== player.id && pl.name.toLowerCase() === newName.toLowerCase(); });
    if (conflict){ conn.send({type:'renameFailed', reason:'That name is taken.'}); return; }
    var oldName = player.name;
    player.name = newName;
    pushLog(oldName + ' renamed themselves to ' + newName);
    broadcastState(); render();
  }
}

function handleHostSideDisconnect(conn){
  var idx = hostControllerConns.indexOf(conn);
  if (idx !== -1){ hostControllerConns.splice(idx, 1); return; }
  var player = null;
  for (var pid in hostConns){ if (hostConns[pid] === conn) player = H.players.filter(function(pl){return pl.id===pid;})[0]; }
  if (player){ player.connected = false; pushLog(player.name + ' disconnected'); broadcastState(); render(); }
}

function sanitizeShootout(s){ // player-facing: no answers
  return {
    order: s.order.map(function(id){ return {id:id, name:(H.players.filter(function(p){return p.id===id;})[0]||{}).name}; }),
    rounds: s.rounds, currentRoundIndex: s.currentRoundIndex, currentTurn: s.currentTurn,
    sudden: s.sudden, winnerId: s.winnerId
  };
}
function sanitizeShootoutForController(s){ // controller-facing: includes answers
  return {
    order: s.order.map(function(id){ return {id:id, name:(H.players.filter(function(p){return p.id===id;})[0]||{}).name}; }),
    rounds: s.rounds, currentRoundIndex: s.currentRoundIndex, currentTurn: s.currentTurn,
    sudden: s.sudden, winnerId: s.winnerId,
    currentQuestion: s.currentQuestion ? {q:s.currentQuestion[0], a:s.currentQuestion[1]} : null
  };
}
function sanitizeForPlayer(forPlayer){
  var revealInfo = null;
  if (H.revealing && H.revealOrder){
    var targetId = H.revealOrder[H.revealIndex];
    var voter = H.players.filter(function(p){return p.id===targetId;})[0];
    var votedForId = H.votes[targetId];
    var votedFor = votedForId ? H.players.filter(function(p){return p.id===votedForId;})[0] : null;
    revealInfo = {
      voterName: voter ? voter.name : '',
      votedForName: votedFor ? votedFor.name : null,
      index: H.revealIndex, total: H.revealOrder.length
    };
  }
  return {
    phase: H.phase, roomCode: H.roomCode,
    players: H.players.map(function(p){ return {id:p.id,name:p.name,alive:p.alive,correct:p.correct,incorrect:p.incorrect,connected:p.connected}; }),
    chainIndex: H.chainIndex,
    chainValue: H.chainIndex >= 0 ? CHAIN_VALUES[H.chainIndex] : 0,
    bank: H.bank, round: H.round,
    currentAskedId: H.currentAskedId,
    currentQuestion: H.currentQuestion ? {q:H.currentQuestion[0]} : null,
    timer: H.timer, countdownEndsAt: H.countdownEndsAt,
    myId: forPlayer.id,
    votedAlready: !!H.votes[forPlayer.id],
    revealing: H.revealing, revealInfo: revealInfo,
    lastElimination: H.lastElimination,
    shootout: H.shootout ? sanitizeShootout(H.shootout) : null,
    winner: H.winner || null
  };
}
function sanitizeForController(){
  var askedPlayer = H.players.filter(function(p){return p.id===H.currentAskedId;})[0];
  var revealInfo = null;
  if (H.revealing && H.revealOrder){
    var targetId = H.revealOrder[H.revealIndex];
    var voter = H.players.filter(function(p){return p.id===targetId;})[0];
    var votedForId = H.votes[targetId];
    var votedFor = votedForId ? H.players.filter(function(p){return p.id===votedForId;})[0] : null;
    revealInfo = { voterName: voter?voter.name:'', votedForName: votedFor?votedFor.name:null, index:H.revealIndex, total:H.revealOrder.length };
  }
  return {
    phase: H.phase, roomCode: H.roomCode, round: H.round,
    players: H.players.map(function(p){ return {id:p.id,name:p.name,alive:p.alive,correct:p.correct,incorrect:p.incorrect,connected:p.connected}; }),
    chainIndex: H.chainIndex, chainValue: H.chainIndex>=0?CHAIN_VALUES[H.chainIndex]:0, bank: H.bank,
    currentAskedId: H.currentAskedId, askedName: askedPlayer?askedPlayer.name:null,
    currentQuestion: H.currentQuestion ? {q:H.currentQuestion[0], a:H.currentQuestion[1]} : null,
    timer: H.timer, countdownEndsAt: H.countdownEndsAt,
    votedCount: Object.keys(H.votes).length,
    revealing: H.revealing, revealOrder: H.revealOrder, revealIndex: H.revealIndex, revealInfo: revealInfo,
    tieCandidates: H.tieCandidates,
    lastElimination: H.lastElimination,
    shootout: H.shootout ? sanitizeShootoutForController(H.shootout) : null,
    winner: H.winner || null,
    questionBankCount: H.questionBank.length, usingCustom: H.usingCustom,
    log: H.log
  };
}
function broadcastState(){
  H.players.forEach(function(p){
    var conn = hostConns[p.id];
    if (!conn || !conn.open) return;
    conn.send({type:'state', state: sanitizeForPlayer(p)});
  });
  hostControllerConns.forEach(function(conn){
    if (!conn || !conn.open) return;
    conn.send({type:'controllerState', state: sanitizeForController()});
  });
}

/* ============================== HOST-AUTHORITATIVE GAME LOGIC ==============================
   These mutate H directly. They're invoked from the CONTROL_ACTIONS dispatch table below,
   which is triggered by network messages from the controller device (the main screen itself
   has no local buttons that call these). */
function advanceTurn(){
  var alive = H.players.filter(function(p){return p.alive;});
  var idx = alive.findIndex(function(p){return p.id===H.currentAskedId;});
  H.currentAskedId = alive[(idx+1) % alive.length].id;
}
function startTimer(){
  H.timer = {duration:H.roundDuration, endsAt: Date.now() + H.roundDuration*1000, running:true};
}

function beginCountdown(target){
  H.phase = 'countdown';
  H.countdownEndsAt = Date.now() + 5000;
  H._countdownTarget = target; // 'round' | 'shootout'
  broadcastState(); render();
}
function finishCountdown(){
  var target = H._countdownTarget;
  H._countdownTarget = null;
  if (target === 'shootout'){
    H.phase = 'shootout';
    H.shootout.currentQuestion = pullQuestion();
    pushLog('Penalty shootout begins');
  } else {
    H.phase = 'playing';
    H.currentQuestion = pullQuestion();
    startTimer();
    pushLog('Round ' + H.round + ' begins');
  }
  broadcastState(); render();
}

function doStartGame(){
  if (H.players.length < 3) return;
  H.round = 1; H.chainIndex = -1;
  H.currentAskedId = H.players[0].id;
  H.currentQuestion = null;
  pushLog('Game started with ' + H.players.length + ' players');
  beginCountdown('round');
}
function doSelectAsked(playerId){
  if (H.phase !== 'playing') return;
  var p = H.players.filter(function(pl){return pl.id===playerId && pl.alive;})[0];
  if (!p) return;
  H.currentAskedId = playerId;
  H.currentQuestion = pullQuestion();
  broadcastState(); render();
}
function doNextQuestion(){
  if (H.phase !== 'playing' || !H.currentAskedId) return;
  H.currentQuestion = pullQuestion();
  broadcastState(); render();
}
function doMarkCorrect(){
  if (!H.currentQuestion || !H.currentAskedId) return;
  var p = H.players.filter(function(pl){return pl.id===H.currentAskedId;})[0];
  p.correct++;
  H.chainIndex = Math.min(H.chainIndex+1, CHAIN_VALUES.length-1);
  pushLog('\u2705 ' + p.name + ' correct \u2014 chain at ' + fmtMoney(CHAIN_VALUES[H.chainIndex]));
  advanceTurn();
  H.currentQuestion = pullQuestion();
  broadcastState(); render();
}
function doMarkIncorrect(){
  if (!H.currentQuestion || !H.currentAskedId) return;
  var p = H.players.filter(function(pl){return pl.id===H.currentAskedId;})[0];
  p.incorrect++;
  pushLog('\u274C ' + p.name + ' incorrect \u2014 chain reset');
  H.chainIndex = -1;
  advanceTurn();
  H.currentQuestion = pullQuestion();
  broadcastState(); render();
}
function doBankChain(bankerName){
  if (H.phase !== 'playing' || H.chainIndex < 0) return;
  var amt = CHAIN_VALUES[H.chainIndex];
  H.bank += amt;
  pushLog('\uD83C\uDFE6 ' + (bankerName ? bankerName + ' banked ' : 'Banked ') + fmtMoney(amt) + ' \u2014 total bank ' + fmtMoney(H.bank));
  H.chainIndex = -1;
  broadcastState(); render();
}
function doEndRound(){
  if (H.phase !== 'playing') return;
  H.phase = 'voting'; H.votes = {}; H.currentQuestion = null;
  H.revealing = false; H.revealOrder = null; H.revealIndex = 0;
  H.timer.running = false;
  pushLog('Round ' + H.round + ' ended \u2014 time to vote');
  broadcastState(); render();
}
function doStartVoteReveal(){
  if (H.phase !== 'voting' || H.revealing) return;
  H.revealOrder = H.players.filter(function(p){return p.alive;}).map(function(p){return p.id;});
  H.revealIndex = 0;
  H.revealing = true;
  broadcastState(); render();
}
function doAdvanceReveal(){
  if (!H.revealing || !H.revealOrder) return;
  H.revealIndex++;
  if (H.revealIndex >= H.revealOrder.length){
    H.revealing = false;
    resolveVotes();
    return;
  }
  broadcastState(); render();
}
function resolveVotes(){
  var alive = H.players.filter(function(p){return p.alive;});
  var tally = {};
  alive.forEach(function(p){ tally[p.id] = 0; });
  for (var voter in H.votes){
    var target = H.votes[voter];
    if (tally[target] !== undefined) tally[target]++;
  }
  var maxVotes = Math.max.apply(null, alive.map(function(p){return tally[p.id];}));
  var top = alive.filter(function(p){ return tally[p.id] === maxVotes; });
  if (top.length === 1){
    finalizeElimination(top[0], tally, '');
    return;
  }
  var scored = top.map(function(p){ return {p:p, score:p.correct - p.incorrect}; });
  var minScore = Math.min.apply(null, scored.map(function(s){return s.score;}));
  var stillTied = scored.filter(function(s){return s.score===minScore;}).map(function(s){return s.p;});
  if (stillTied.length === 1){
    finalizeElimination(stillTied[0], tally, 'Tie broken by in-game performance.');
    return;
  }
  H.tieCandidates = stillTied.map(function(p){return p.id;});
  H.tieTally = tally;
  broadcastState(); render();
}
function finalizeElimination(eliminated, tally, note){
  eliminated.alive = false;
  H.lastElimination = {
    name: eliminated.name,
    tally: H.players.filter(function(p){return tally[p.id]!==undefined;})
      .map(function(p){return {name:p.name, votes:tally[p.id]};})
      .sort(function(a,b){return b.votes-a.votes;}),
    note: note
  };
  H.tieCandidates = null; H.tieTally = null;
  H.phase = 'elimination';
  pushLog('\uD83D\uDEAA ' + eliminated.name + ' voted off as the Weakest Link');
  broadcastState(); render();
}
function doManualTieBreak(playerId){
  var p = H.players.filter(function(pl){return pl.id===playerId;})[0];
  if (!p) return;
  finalizeElimination(p, H.tieTally, 'The host broke the tie.');
}
function doContinueAfterElimination(){
  var alive = H.players.filter(function(p){return p.alive;});
  if (alive.length === 2){
    H.shootout = {order:[alive[0].id, alive[1].id], rounds:[], currentRoundIndex:0, currentTurn:0, currentQuestion:null, sudden:false, winnerId:null};
    pushLog('Final 2! Get ready for the penalty shootout');
    beginCountdown('shootout');
  } else {
    H.round++; H.chainIndex = -1;
    H.currentAskedId = alive[0].id; H.currentQuestion = null;
    beginCountdown('round');
  }
}

/* ---- shootout ---- */
function scoreOf(s, idx){
  return s.rounds.reduce(function(sum,r){ return sum + ((r['p'+idx]==='correct')?1:0); }, 0);
}
function doShootoutNextQuestion(){
  var s = H.shootout;
  if (!s || s.winnerId) return;
  s.currentQuestion = pullQuestion();
  broadcastState(); render();
}
function doShootoutMark(result){
  var s = H.shootout;
  if (!s || !s.currentQuestion) return;
  var turnPid = s.order[s.currentTurn];
  var p = H.players.filter(function(pl){return pl.id===turnPid;})[0];
  if (!s.rounds[s.currentRoundIndex]) s.rounds[s.currentRoundIndex] = {p0:null,p1:null};
  s.rounds[s.currentRoundIndex]['p'+s.currentTurn] = result;
  if (result === 'correct') p.correct++; else p.incorrect++;
  s.currentQuestion = null;
  pushLog(p.name + ': ' + (result==='correct' ? '\u2705' : '\u274C') + ' in the shootout');

  checkShootoutEnd();
  if (!s.winnerId){
    if (s.currentTurn === 0){ s.currentTurn = 1; }
    else { s.currentTurn = 0; s.currentRoundIndex++; }
    s.currentQuestion = pullQuestion();
  }
  broadcastState(); render();
}
function checkShootoutEnd(){
  var s = H.shootout;
  var REG = 5;
  var r = s.rounds[s.currentRoundIndex];
  if (!r || r.p0 == null || r.p1 == null) return;
  if (!s.sudden){
    var sc0 = scoreOf(s,0), sc1 = scoreOf(s,1);
    var wavesDone = s.currentRoundIndex + 1;
    var remain0 = REG - wavesDone, remain1 = REG - wavesDone;
    if (wavesDone >= REG){
      if (sc0 !== sc1){ declareShootoutWinner(sc0>sc1?0:1); return; }
      s.sudden = true; return;
    }
    if (sc0 > sc1 + remain1){ declareShootoutWinner(0); return; }
    if (sc1 > sc0 + remain0){ declareShootoutWinner(1); return; }
  } else {
    var w0 = r.p0 === 'correct', w1 = r.p1 === 'correct';
    if (w0 && !w1){ declareShootoutWinner(0); return; }
    if (w1 && !w0){ declareShootoutWinner(1); return; }
  }
}
function declareShootoutWinner(idx){
  var s = H.shootout;
  s.winnerId = s.order[idx];
  var winner = H.players.filter(function(p){return p.id===s.winnerId;})[0];
  H.phase = 'gameover';
  H.winner = winner.name;
  pushLog('\uD83C\uDFC6 ' + winner.name + ' wins the game!');
}
function doPlayAgain(){
  var oldPlayers = H.players.map(function(p){ return {id:p.id,name:p.name,alive:true,correct:0,incorrect:0,connected:p.connected}; });
  var dur = H.roundDuration, code = H.roomCode, ready = H.ready;
  var qBank = H.questionBank, usingCustom = H.usingCustom;
  H = newHostState();
  H.roundDuration = dur; H.roomCode = code; H.ready = ready; H.players = oldPlayers;
  H.questionBank = qBank; H.usingCustom = usingCustom;
  broadcastState(); render();
}

/* ---- lobby management (host controls only, always via the controller) ---- */
function doKickPlayer(playerId){
  if (H.phase !== 'lobby') return;
  var idx = H.players.findIndex(function(p){return p.id===playerId;});
  if (idx === -1) return;
  var p = H.players[idx];
  var conn = hostConns[playerId];
  if (conn){ try{ if (conn.open) conn.send({type:'kicked'}); }catch(e){} try{ conn.close(); }catch(e){} }
  delete hostConns[playerId];
  H.players.splice(idx, 1);
  pushLog(p.name + ' was removed by the host');
  broadcastState(); render();
}
function doAddPlayer(name){
  if (H.phase !== 'lobby') return;
  name = (name || 'Player').toString().trim().slice(0,18);
  if (!name) return;
  var finalName = name, n = 2;
  while (H.players.some(function(pl){ return pl.name.toLowerCase() === finalName.toLowerCase(); })){
    finalName = name + ' ' + n; n++;
  }
  var p = {id:uid(), name:finalName, alive:true, correct:0, incorrect:0, connected:false};
  H.players.push(p);
  pushLog(finalName + ' added by the host');
  broadcastState(); render();
}
function doSetQuestionBank(payload){
  if (!payload || !Array.isArray(payload.questions) || payload.questions.length === 0) return;
  H.questionBank = payload.questions;
  H._deck = [];
  H.usingCustom = !!payload.usingCustom;
  pushLog('Loaded ' + payload.questions.length + ' custom questions');
  broadcastState(); render();
}
function doResetQuestionBank(){
  H.questionBank = QUESTIONS.slice();
  H._deck = [];
  H.usingCustom = false;
  pushLog('Reset to the built-in question bank');
  broadcastState(); render();
}

function doCloseRoom(){
  H.players.forEach(function(p){
    var conn = hostConns[p.id];
    if (conn && conn.open){ try{ conn.send({type:'roomClosed'}); }catch(e){} }
  });
  hostControllerConns.forEach(function(conn){
    if (conn && conn.open){ try{ conn.send({type:'roomClosed'}); }catch(e){} }
  });
  setTimeout(function(){
    try{ if (peer) peer.destroy(); }catch(e){}
    hostConns = {}; hostControllerConns = [];
    role = null; H = null; localView = 'landing';
    render();
  }, 400); // brief pause so the roomClosed notice actually reaches everyone before the transport tears down
}

var CONTROL_ACTIONS = {
  startGame: function(){ doStartGame(); },
  selectAsked: function(arg){ doSelectAsked(arg); },
  nextQuestion: function(){ doNextQuestion(); },
  markCorrect: function(){ doMarkCorrect(); },
  markIncorrect: function(){ doMarkIncorrect(); },
  bankChain: function(){ doBankChain(); },
  endRound: function(){ doEndRound(); },
  startVoteReveal: function(){ doStartVoteReveal(); },
  advanceReveal: function(){ doAdvanceReveal(); },
  manualTieBreak: function(arg){ doManualTieBreak(arg); },

}, 500);

/* Lightweight timer ticker: updates ONLY the big countdown/round-timer text directly in the
   DOM, never calling render(), so the rest of the screen (podiums etc.) never re-mounts and
   never flickers while everyone is just waiting on a mark. */
function tickLiveTimers(){
  var endsAt = null, running = false, cdEndsAt = null;
  if (role === 'host' && H){
    if (H.phase === 'playing'){ endsAt = H.timer.endsAt; running = H.timer.running; }
    if (H.phase === 'countdown'){ cdEndsAt = H.countdownEndsAt; }
  } else if (role === 'controller' && CTRL.state){
    if (CTRL.state.phase === 'playing'){ endsAt = CTRL.state.timer.endsAt; running = CTRL.state.timer.running; }
    if (CTRL.state.phase === 'countdown'){ cdEndsAt = CTRL.state.countdownEndsAt; }
  } else if (role === 'player' && P.state){
    if (P.state.phase === 'playing'){ endsAt = P.state.timer.endsAt; running = P.state.timer.running; }
    if (P.state.phase === 'countdown'){ cdEndsAt = P.state.countdownEndsAt; }
  }
  var text = running ? fmtClock(endsAt - Date.now()) : '--:--';
  var low = running && (endsAt - Date.now()) < 10000;
  var nodes = document.querySelectorAll('.js-timer');
  for (var i = 0; i < nodes.length; i++){
    nodes[i].textContent = text;
    if (low) nodes[i].classList.add('low'); else nodes[i].classList.remove('low');
  }
  if (cdEndsAt !== null){
    var secsLeft = Math.max(0, Math.ceil((cdEndsAt - Date.now())/1000));
    var cdNodes = document.querySelectorAll('.js-countdown');
    for (var j = 0; j < cdNodes.length; j++){
      cdNodes[j].textContent = secsLeft > 0 ? String(secsLeft) : 'GO!';
    }
  }
}
setInterval(tickLiveTimers, 500);

/* ============================== PLAYER NETWORKING ============================== */
function getPlayerSession(){
  try{ return JSON.parse(sessionStorage.getItem('wlink_session') || 'null'); } catch(e){ return null; }
}
function savePlayerSession(obj){
  try{ sessionStorage.setItem('wlink_session', JSON.stringify(obj)); } catch(e){}
}
function clearPlayerSession(){
  try{ sessionStorage.removeItem('wlink_session'); } catch(e){}
}

function connectPlayerToHost(code, name){
  role = 'player';
  P.roomCode = code; P.myName = name;
  P.error = null;
  savePlayerSession({roomCode: code, name: name, playerId: (getPlayerSession()||{}).playerId || null});
  function doConnect(){
    var conn = peer.connect('wlink-' + code, {reliable:true});
    P.conn = conn;
    conn.on('open', function(){
      var sess = getPlayerSession();
      conn.send({type:'join', name:name, rejoinId: sess ? sess.playerId : null});
      P.connLost = false;
      render();
    });
    conn.on('data', function(d){ handleHostMessage(d); });
    conn.on('close', function(){
      P.connLost = true; render();
      if (role === 'player' && !P.error && !P.denied) scheduleReconnect(code, name);
    });
  }
  if (peer && !peer.destroyed && peer.open){
    doConnect(); render(); return;
  }
  try{
    peer = new Peer(undefined, {debug:0});
  } catch(e){
    P.error = 'Could not start a connection. Try again.';
    render(); return;
  }
  peer.on('open', function(){ doConnect(); render(); });
  peer.on('disconnected', function(){ try{ peer.reconnect(); }catch(e){} });
  peer.on('error', function(err){
    if (err && err.type === 'peer-unavailable'){
      P.error = 'Room not found. Double-check the code with your host.';
      clearPlayerSession();
    } else {
      P.connLost = true;
      scheduleReconnect(code, name);
    }
    render();
  });
  render();
}
var reconnectTimer = null;
function scheduleReconnect(code, name){
  if (reconnectTimer) return;
  reconnectTimer = setTimeout(function(){
    reconnectTimer = null;
    if (role === 'player' && P.connLost) connectPlayerToHost(code, name);
  }, 3000);
}

Actions.joinRoom = function(){
  var name = (($('#playerName')||{}).value || '').trim();
  var code = (($('#roomCodeInput')||{}).value || '').trim().toUpperCase();
  if (!name || !code){ alert('Enter your name and the room code.'); return; }
  connectPlayerToHost(code, name);
};
Actions.reconnectNow = function(){
  if (P.roomCode && P.myName) connectPlayerToHost(P.roomCode, P.myName);
};
Actions.retryJoin = function(){
  localView = 'playerSetup'; role = null; clearPlayerSession();
  P = {conn:null,roomCode:'',myName:'',myId:null,state:null,error:null,denied:null,connLost:false,localVoted:false,voteDraft:null,bankFlash:false,renameError:null};
  render();
};

function handleHostMessage(msg){
  if (msg.type === 'welcome'){
    P.myId = msg.playerId;
    savePlayerSession({roomCode: P.roomCode, name: P.myName, playerId: msg.playerId});
    P.denied = null;
    render();
  } else if (msg.type === 'state'){
    P.state = msg.state;
    P.connLost = false;
    // A round's vote is only ever meaningful while phase==='voting'; once we leave that phase
    // (round ends, or a fresh game starts via Play Again) clear the local flags so a stale
    // "already voted" from a previous round/game never blocks the next vote.
    if (msg.state.phase !== 'voting'){ P.localVoted = false; P.voteDraft = null; }
    render();
  } else if (msg.type === 'denied'){
    P.denied = msg.reason;
    clearPlayerSession();
    render();
  } else if (msg.type === 'kicked'){
    P.denied = 'You were removed from the game by the host.';
    clearPlayerSession();
    render();
  } else if (msg.type === 'roomClosed'){
    P.denied = 'The host has closed this room.';
    clearPlayerSession();
    render();
  } else if (msg.type === 'renameFailed'){
    P.renameError = msg.reason;
    render();
  }
}
Actions.submitVote = function(){
  var sel = $('#voteSelect');
  if (!sel || !sel.value) return;
  P.conn.send({type:'vote', targetId: sel.value});
  P.localVoted = true;
  P.voteDraft = null;
  render();
};
Actions.callBank = function(){
  P.conn.send({type:'callBank'});
  P.bankFlash = true;
  render();
  setTimeout(function(){ P.bankFlash = false; render(); }, 2500);
};
Actions.renameMe = function(){
  var input = $('#renameInput');
  var newName = input ? input.value.trim() : '';
  if (!newName || !P.conn) return;
  P.renameError = null;
  P.conn.send({type:'rename', newName: newName});
  render();
};

/* ============================== CONTROLLER (2ND SCREEN) NETWORKING ============================== */
function connectControllerToHost(code){
  role = 'controller';
  CTRL.roomCode = code; CTRL.error = null;
  try{
    peer = new Peer(undefined, {debug:0});
  } catch(e){
    CTRL.error = 'Could not start a connection. Try again.';
    render(); return;
  }
  peer.on('open', function(){
    var conn = peer.connect('wlink-' + code, {reliable:true});
    CTRL.conn = conn;
    conn.on('open', function(){ conn.send({type:'joinController'}); CTRL.connLost = false; render(); });
    conn.on('data', function(d){ handleControllerMessage(d); });
    conn.on('close', function(){
      CTRL.connLost = true; render();
      setTimeout(function(){ if (role === 'controller' && CTRL.connLost && !CTRL.error) connectControllerToHost(code); }, 3000);
    });
    render();
  });
  peer.on('disconnected', function(){ try{ peer.reconnect(); }catch(e){} });
  peer.on('error', function(err){
    CTRL.error = (err && err.type === 'peer-unavailable')
      ? 'Room not found. Double-check the code with your host.'
      : 'Connection error (' + (err && err.type) + '). Check your internet and try again.';
    render();
  });
  render();
}
function handleControllerMessage(msg){
  if (msg.type === 'welcomeController'){ CTRL.error = null; render(); }
  else if (msg.type === 'controllerState'){ CTRL.state = msg.state; CTRL.connLost = false; render(); }
  else if (msg.type === 'questionBankData'){ CTRL.questionBankCache = msg.questions; render(); }
  else if (msg.type === 'roomClosed'){ CTRL.error = 'The host closed this room.'; render(); }
}
function sendControl(action, arg){
  if (CTRL.conn && CTRL.conn.open) CTRL.conn.send({type:'control', action:action, arg:arg});
}

function ladderHtml(chainIndex){
  return '<div class="ladder-h">' + CHAIN_VALUES.map(function(v,i){
    var cls = i===chainIndex ? 'rung-h current' : (i<chainIndex ? 'rung-h climbed' : 'rung-h');
    return '<div class="'+cls+'">'+fmtMoney(v)+'</div>';
  }).join('') + '</div>';
}
function bigTimerHtml(){
  return '<div class="big-timer js-timer">--:--</div>';
}
function podiumRow(players, opts){
  opts = opts || {};
  return '<div class="podium-row">' + players.map(function(p){
    var isSpot = p.id === opts.highlightId;
    var cls = 'podium' + (isSpot ? ' spotlight' : '');
    var acc = accuracyOf(p);
    return '<div class="'+cls+'">' +
      (isSpot ? '<div class="spotlight-beam"></div>' : '') +
      '<div class="podium-name">'+esc(p.name)+(p.connected===false?' \uD83D\uDCF5':'')+'</div>' +
      (opts.showAccuracy ? '<div class="podium-acc">'+(acc===null?'\u2014':acc+'%')+' \u00b7 '+p.correct+'\u2713/'+p.incorrect+'\u2717</div>' : '') +
      '<div class="podium-base"></div>' +
    '</div>';
  }).join('') + '</div>';
}
function controllerRoster(players, currentAskedId, selectable){
  var list = selectable ? players.filter(function(p){return p.alive;}) : players;
  return '<div class="roster">' + list.map(function(p){
    var acc = accuracyOf(p);
    var cls = 'chip' + (p.id===currentAskedId?' selected':'');
    var action = selectable ? ' data-action="ctrlSelectAsked" data-arg="'+p.id+'" style="cursor:pointer;"' : '';
    return '<div class="'+cls+'"'+action+'>' +
      '<span><span class="dot'+(p.connected?'':' off')+'"></span>'+esc(p.name)+'</span>' +
      '<span class="sub">'+(acc===null?'\u2014':acc+'%')+' \u00b7 '+p.correct+'\u2713/'+p.incorrect+'\u2717</span>' +
    '</div>';
  }).join('') + '</div>';
}
function kickBoxes(s, pIdx){
  var out = '';
  for (var i=0;i<5;i++){
    var r = s.rounds[i];
    var v = r ? r['p'+pIdx] : null;
    var cls = v==='correct' ? 'kick hit' : (v==='incorrect' ? 'kick miss' : 'kick');
    out += '<div class="'+cls+'">'+(v==='correct'?'\u2713':(v==='incorrect'?'\u2717':''))+'</div>';
  }
  return '<div class="kicks">'+out+'</div>';
}
function standingsHtml(players){
  var sorted = players.slice().sort(function(a,b){
    if (a.alive !== b.alive) return a.alive ? -1 : 1;
    return (b.correct-b.incorrect) - (a.correct-a.incorrect);
  });
  return '<div class="standings">'+sorted.map(function(p){
    var acc = accuracyOf(p);
    return '<div class="r"><span>'+esc(p.name)+'</span><span>'+(acc===null?'\u2014':acc+'%')+' \u00b7 '+p.correct+'\u2713/'+p.incorrect+'\u2717</span></div>';
  }).join('')+'</div>';
}

    var votedFor = votedForId ? H.players.filter(function(p){return p.id===votedForId;})[0] : null;
    return '<div class="main-compact">' + topBarSimple() +
      podiumRow(alive, {highlightId: targetId}) +
      '<div class="elim-card" style="padding:14px;">' +
        '<div class="q-label">'+esc(voter?voter.name:'')+' voted for</div>' +
        '<div class="name" style="color:var(--gold);">'+(votedFor?esc(votedFor.name):'No one')+'</div>' +
      '</div></div>';
  }
  var votedCount = Object.keys(H.votes).length;
  return '<div class="main-compact">' + topBarSimple() + podiumRow(alive,{}) +
    '<div style="text-align:center;padding:16px;"><h2>Voting\u2026</h2><p class="tag">'+votedCount+' of '+alive.length+' voted</p></div></div>';
}
function hostEliminationView(){

  return '<div class="main-compact">' + topBarSimple() + podiumRow(alive,{}) +
    '<div class="elim-card"><div class="q-label">Voted off</div><div class="name">'+esc(e.name)+'</div>' +
    (e.note ? '<p class="tag">'+esc(e.note)+'</p>' : '') +
    '<div class="tally">'+e.tally.map(function(t){ return '<div class="r"><span>'+esc(t.name)+'</span><span>'+t.votes+' vote'+(t.votes===1?'':'s')+'</span></div>'; }).join('')+'</div>' +
  '</div></div>';
}
function hostShootoutView(){
  var s = H.shootout;
  var p0 = H.players.filter(function(p){return p.id===s.order[0];})[0];
  var p1 = H.players.filter(function(p){return p.id===s.order[1];})[0];

    (s.currentQuestion
      ? '<div class="stage compact"><div class="q-label">'+(s.sudden?'Sudden death \u2014 ':'')+'Reading to '+esc(turnP.name)+'</div><div class="q-text">'+esc(s.currentQuestion[0])+'</div></div>'
      : '<div class="stage compact"><div class="q-label">'+(s.sudden?'Sudden death':'Up next')+'</div><div class="q-text" style="color:var(--blue);">'+esc(turnP.name)+'</div></div>') +

}
function hostGameOverView(){
  return '<div class="gameover main-compact">' +
    '<div class="trophy">\uD83C\uDFC6</div>' +
    '<div class="winner">'+esc(H.winner)+' wins!</div>' +
    '<div class="amt" style="font-family:\'Oswald\',sans-serif;font-size:34px;color:var(--gold);margin-bottom:4px;">'+fmtMoney(H.bank)+'</div>' +

/* ============================== VIEWS: CONTROLLER (2ND SCREEN — HOST CONTROLS) ============================== */
function controllerRootView(){
  if (CTRL.error){
    return '<div class="landing"><div class="error-box">'+esc(CTRL.error)+'</div><button class="big-btn gold" data-action="ctrlRetry">Try again</button></div>';
  }
  if (!CTRL.state){
    return '<div class="landing"><p class="tag">Connecting to the main screen\u2026</p></div>' +
      (CTRL.connLost ? '<div class="error-box" style="max-width:400px;margin:20px auto 0;">Reconnecting\u2026</div>' : '');
  }
  var s = CTRL.state;
  var inner;
  if (s.phase === 'lobby') inner = controllerLobbyView(s);
  else if (s.phase === 'countdown') inner = controllerCountdownView(s);
  else if (s.phase === 'playing') inner = controllerPlayingView(s);
  else if (s.phase === 'voting') inner = controllerVotingView(s);
  else if (s.phase === 'elimination') inner = controllerEliminationView(s);
  else if (s.phase === 'shootout') inner = controllerShootoutView(s);
  else if (s.phase === 'gameover') inner = controllerGameOverView(s);
  else inner = '<div class="center-msg">Unknown phase.</div>';
  return ctrlShell(inner);
}
function ctrlShell(inner){
  return '<div class="ctrl-wrap">' +
    '<div style="text-align:right;margin-bottom:6px;"><button class="back-link" style="padding:0;font-size:12px;color:var(--muted);" data-action="ctrlCloseRoom">Close room \u2715</button></div>' +
    inner +
  '</div>';
}
function ctrlTopBar(s){
  return '<div class="top-bar"><div class="room-pill">ROOM '+esc(s.roomCode)+'</div><div class="stat-strip"><span class="stat-chip gold"><b>'+fmtMoney(s.bank)+'</b>Bank</span></div></div>';
}
function controllerQuestionBankPanel(s){

    '<div class="action-row" style="justify-content:flex-start;margin-top:8px;">' +
      '<button class="act-btn primary" data-action="ctrlUseCSVQuestions">Use these '+ctrlCsvParsedQuestions.length+' questions</button>' +
      '<button class="act-btn neutral" data-action="ctrlClearCSVPreview">Cancel</button>' +
    '</div>'
  ) : '';
  var bankList = ctrlShowQuestionBank ? ('<div class="qbank-list">' + (CTRL.questionBankCache||[]).map(function(pair,i){
      return '<div class="qbank-row"><span class="qbank-num">'+(i+1)+'.</span><div><div class="qbank-q">'+esc(pair[0])+'</div><div class="qbank-a">'+esc(pair[1])+'</div></div></div>';
    }).join('') + '</div>') : '';

    '<textarea id="ctrlCustomQuestions" rows="5" placeholder="What is the capital of France? | Paris" style="width:100%;padding:12px 14px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--text);font-size:14px;font-family:Inter,sans-serif;resize:vertical;">'+esc(ctrlQuestionsDraft)+'</textarea>' +

function controllerLobbyView(s){
  var rows = s.players.map(function(p){
    return '<div class="chip"><span><span class="dot'+(p.connected?'':' off')+'"></span>'+esc(p.name)+'</span>' +

    '<div class="top-bar"><div class="room-pill">ROOM '+esc(s.roomCode)+'</div><div class="stat-strip"><span class="stat-chip"><b>'+s.players.length+'</b>Joined</span></div></div>' +
    '<div class="panel">' +
      '<h3>Invite players</h3>' +
      '<p style="font-size:13px;color:var(--muted);margin:0 0 10px;">Share this link \u2014 it opens straight to the join form with the code already filled in.</p>' +

      '<div class="action-row" style="justify-content:flex-start;margin-top:10px;">' +
        '<input id="addPlayerInput" placeholder="Add a player without a device" style="flex:1;min-width:160px;padding:10px 12px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--text);">' +

function controllerCountdownView(s){

    '<button class="act-btn neutral full-btn" data-action="ctrlEndRound">End round now</button>';

function controllerVotingView(s){

        '<div class="name" style="color:var(--gold);font-family:\'Oswald\',sans-serif;font-size:26px;">'+(s.revealInfo.votedForName?esc(s.revealInfo.votedForName):'No one')+'</div>' +
        '<button class="big-btn gold" style="margin-top:16px;" data-action="ctrlAdvanceReveal">'+(isLast?'Show result':'Reveal next vote')+'</button>' +

/* ============================== VIEWS: PLAYER ============================== */
function playerRootView(){
  if (P.error){
    return '<div class="landing"><div class="error-box">'+esc(P.error)+'</div><button class="big-btn gold" data-action="retryJoin">Try again</button></div>';
  }
  if (P.denied){
    return '<div class="landing"><div class="error-box">'+esc(P.denied)+'</div><button class="big-btn gold" data-action="retryJoin">Back</button></div>';
  }
  if (!P.myId || !P.state){
    return '<div class="landing"><p class="tag">Connecting to the host\u2026</p></div>';
  }
  var s = P.state;
  var me = s.players.filter(function(p){return p.id===s.myId;})[0] || {correct:0,incorrect:0,alive:true,name:P.myName};
  var wrap = '<div class="player-wrap">' +
    '<div class="p-header"><div class="rc">ROOM '+esc(s.roomCode)+'</div></div>' +
    (P.connLost ? '<div class="error-box">Connection to host lost. Trying to reconnect\u2026 <button class="back-link" style="display:inline;padding:0;color:var(--blue);" data-action="reconnectNow">Reconnect now</button></div>' : '');

  var body;
  if (s.phase === 'lobby') body = playerLobbyView(s, me);
  else if (s.phase === 'countdown') body = playerCountdownView(s, me);
  else if (s.phase === 'playing') body = playerPlayingView(s, me);
  else if (s.phase === 'voting') body = playerVotingView(s, me);
  else if (s.phase === 'elimination') body = playerEliminationView(s, me);
  else if (s.phase === 'shootout') body = playerShootoutView(s, me);
  else if (s.phase === 'gameover') body = playerGameOverView(s, me);
  else body = '<div class="center-msg">Waiting\u2026</div>';

  return wrap + body + '<div class="footer-note">You are '+esc(me.name)+'</div></div>';
}

function playerLobbyView(s, me){
  var list = s.players.map(function(p){ return '<div class="chip"><span><span class="dot'+(p.connected?'':' off')+'"></span>'+esc(p.name)+(p.id===s.myId?' (you)':'')+'</span></div>'; }).join('');
  return '<div class="panel"><h3>Waiting for the host to start\u2026</h3><div class="roster">'+list+'</div></div>' +
    '<div class="panel">' +
      '<h3>Change your name</h3>' +
      (P.renameError ? '<p style="color:var(--red);font-size:13px;margin:0 0 8px;">'+esc(P.renameError)+'</p>' : '') +
      '<input id="renameInput" maxlength="18" value="'+esc(me.name)+'" style="width:100%;padding:10px 12px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--text);margin-bottom:10px;">' +
      '<button class="act-btn primary full-btn" data-action="renameMe">Save name</button>' +
    '</div>';
}
function playerCountdownView(s, me){
  var label = s.shootout ? 'Final shootout starting\u2026' : 'Round ' + s.round + ' starting\u2026';
  return '<div class="panel countdown-block">' +
      '<div class="countdown-label">'+label+'</div>' +
      '<div class="js-countdown big-countdown">5</div>' +
    '</div>' +
    (me.alive ? '' : '<div class="spectator-tag">You\'ve been voted off \u2014 spectating</div>');
}
function playerStatsHtml(me){
  var acc = accuracyOf(me);
  return '<div class="p-stats">' +
    '<div class="p-stat"><b>'+(acc===null?'\u2014':acc+'%')+'</b><span>Accuracy</span></div>' +
    '<div class="p-stat"><b>'+me.correct+'</b><span>Correct</span></div>' +
    '<div class="p-stat"><b>'+me.incorrect+'</b><span>Incorrect</span></div>' +
  '</div>';
}
function allPlayersAccuracyTable(players){
  var sorted = players.slice().sort(function(a,b){
    var aa = accuracyOf(a), ba = accuracyOf(b);
    return (ba===null?-1:ba) - (aa===null?-1:aa);
  });
  return '<div class="panel" style="text-align:left;"><h3>Everyone\'s accuracy</h3><div class="roster">' + sorted.map(function(p){
    var acc = accuracyOf(p);
    return '<div class="chip'+(!p.alive?' dead':'')+'"><span>'+esc(p.name)+'</span><span class="sub">'+(acc===null?'\u2014':acc+'%')+' \u00b7 '+p.correct+'\u2713/'+p.incorrect+'\u2717</span></div>';
  }).join('') + '</div></div>';
}
function playerPlayingView(s, me){
  if (!me.alive){
    return '<div class="spectator-tag">You\'ve been voted off \u2014 spectating</div>' +
      '<div class="panel"><h3>Chain</h3>'+ladderHtml(s.chainIndex)+'<div class="bank-total"><div class="amt">'+fmtMoney(s.bank)+'</div><div class="lbl">Team bank</div></div></div>' +
      allPlayersAccuracyTable(s.players);
  }
  var isMyTurn = s.currentAskedId === s.myId;
  var askedPlayer = s.players.filter(function(p){return p.id===s.currentAskedId;})[0];
  var out = bigTimerHtml();
  out += playerStatsHtml(me);
  out += '<div class="turn-flag '+(isMyTurn?'yours':'theirs')+'">'+(isMyTurn ? "You're on the spot!" : (askedPlayer?esc(askedPlayer.name)+' is answering':'\u2014'))+'</div>';
  if (s.currentQuestion) out += '<div class="panel" style="text-align:center;"><div class="q-label">Question</div><div class="q-text" style="font-size:19px;">'+esc(s.currentQuestion.q)+'</div></div>';
  out += '<div class="panel"><h3>Chain</h3>'+ladderHtml(s.chainIndex)+'<div class="bank-total"><div class="amt">'+fmtMoney(s.bank)+'</div><div class="lbl">Team bank</div></div></div>';
  if (isMyTurn){
    out += '<button class="full-btn act-btn bank" data-action="callBank" '+(s.chainIndex<0?'disabled':'')+'>'+(P.bankFlash ? 'Banked! \uD83C\uDFE6' : 'Bank the chain now'+(s.chainIndex>=0?' ('+fmtMoney(s.chainValue)+')':''))+'</button>';
  }
  return out;
}
function playerVotingView(s, me){
  if (s.revealing && s.revealInfo){
    return (!me.alive ? '<div class="spectator-tag">You\'ve been voted off \u2014 spectating</div>' : '') +
      '<div class="panel" style="text-align:center;">' +
        '<p class="tag">Revealing vote '+(s.revealInfo.index+1)+' of '+s.revealInfo.total+'</p>' +
        '<div class="q-label">'+esc(s.revealInfo.voterName)+' voted for</div>' +
        '<div class="name" style="font-family:\'Oswald\',sans-serif;font-size:28px;color:var(--gold);margin-top:6px;">'+(s.revealInfo.votedForName?esc(s.revealInfo.votedForName):'No one \u2014 no vote cast')+'</div>' +
      '</div>';
  }
  if (!me.alive){
    return '<div class="spectator-tag">You\'ve been voted off \u2014 spectating</div><div class="center-msg">The remaining players are voting on the weakest link.</div>' + allPlayersAccuracyTable(s.players);
  }
  if (s.votedAlready || P.localVoted){
    return '<div class="panel" style="text-align:center;"><h3>Vote submitted</h3><p class="tag">Waiting for the rest of the group\u2026</p></div>';
  }
  var options = s.players.filter(function(p){return p.alive && p.id!==s.myId;});
  var opts = '<option value="">Choose a player\u2026</option>' + options.map(function(p){
    return '<option value="'+p.id+'"'+(P.voteDraft===p.id?' selected':'')+'>'+esc(p.name)+'</option>';
  }).join('');
  return '<div class="panel" style="text-align:center;"><h3>Who\'s the weakest link?</h3>' +
    '<select id="voteSelect" class="vote-select" style="width:100%;padding:14px;border-radius:10px;background:var(--panel-2);color:var(--text);border:1px solid var(--line);font-size:16px;margin-bottom:12px;">'+opts+'</select>' +
    '<button class="full-btn act-btn incorrect" data-action="submitVote">Submit vote</button></div>';
}
function playerEliminationView(s, me){
  var e = s.lastElimination;
  return '<div class="elim-card"><div class="q-label">Voted off</div><div class="name">'+esc(e.name)+'</div>' +
    (e.note?'<p class="tag">'+esc(e.note)+'</p>':'') +
    '<div class="tally">'+e.tally.map(function(t){ return '<div class="r"><span>'+esc(t.name)+'</span><span>'+t.votes+' vote'+(t.votes===1?'':'s')+'</span></div>'; }).join('')+'</div>' +
    (me.alive ? '<p class="tag">Get ready for the next round\u2026</p>' : '<div class="spectator-tag">You\'re spectating the rest of the game</div>') +
  '</div>' + (me.alive ? '' : allPlayersAccuracyTable(s.players));
}
function playerShootoutView(s, me){
  var sh = s.shootout;
  var mine = sh.order.filter(function(o){return o.id===s.myId;}).length>0;
  var out = '';
  if (!mine){
    out += '<div class="spectator-tag">You\'ve been voted off \u2014 spectating the final shootout</div>';
  }
  var turnO = sh.order[sh.currentTurn];
  out += '<div class="duel">' +
    sh.order.map(function(o,i){
      return '<div class="duel-side'+(sh.currentTurn===i?' active':'')+'"><div class="nm">'+esc(o.name)+'</div>'+kickBoxes(sh,i)+'</div>';
    }).join('') +
  '</div>';
  if (sh.sudden) out += '<div class="banner">Sudden death!</div>';
  if (mine){
    var isMyTurn = turnO.id === s.myId;
    out += '<div class="turn-flag '+(isMyTurn?'yours':'theirs')+'">'+(isMyTurn?"You're up!":'Waiting for your turn')+'</div>';
  } else {
    out += '<div class="turn-flag theirs">'+esc(turnO.name)+' is up</div>';
    out += allPlayersAccuracyTable(s.players);
  }
  return out;
}
function playerGameOverView(s, me){
  var won = s.winner === me.name;
  return '<div class="gameover"><div class="trophy">\uD83C\uDFC6</div><div class="winner">'+esc(s.winner)+' wins!</div>' +
    '<div class="amt" style="font-family:\'Oswald\',sans-serif;font-size:30px;color:var(--gold);margin-bottom:4px;">'+fmtMoney(s.bank)+'</div>' +
    '<div class="lbl" style="color:var(--muted);font-size:13px;margin-bottom:18px;">Final team bank</div>' +
    (won ? '<p class="tag">That\'s you \uD83C\uDF89</p>' : '<p class="tag">Thanks for playing!</p>') +
    standingsHtml(s.players) +
  '</div>';
}

/* ============================== RENDER DISPATCH ============================== */
function render(){
  var html;
  if (role === null){
    if (localView === 'hostSetup') html = hostSetupView();
    else if (localView === 'playerSetup') html = playerSetupView();
    else if (localView === 'controllerSetup') html = controllerSetupView();
    else html = landingView();
  } else if (role === 'host'){
    html = hostRootView();
  } else if (role === 'controller'){
    html = controllerRootView();
  } else {
    html = playerRootView();
  }
  $('#app').innerHTML = html;
}

document.addEventListener('input', function(e){
  if (e.target && e.target.id === 'ctrlCustomQuestions') ctrlQuestionsDraft = e.target.value;
});
document.addEventListener('change', function(e){
  if (!e.target) return;
  if (e.target.id === 'voteSelect'){ P.voteDraft = e.target.value || null; return; }
  if (e.target.id !== 'ctrlCsvFileInput') return;
  var file = e.target.files && e.target.files[0];
  if (!file) return;
  var reader = new FileReader();
  reader.onload = function(ev){
    var parsed = parseCSVQuestions(ev.target.result);
    ctrlCsvParsedQuestions = parsed;
    ctrlCsvFileName = file.name;
    render();
  };
  reader.onerror = function(){
    ctrlCsvParsedQuestions = null; ctrlCsvFileName = null;
    alert('Could not read that file. Make sure it\'s a plain .csv file.');
    render();
  };
  reader.readAsText(file);
});
document.addEventListener('click', function(e){
  var el = e.target.closest('[data-action]');
  if (!el) return;
  var action = el.dataset.action;
  var arg = el.dataset.arg;
  if (Actions[action]) Actions[action](arg, el);
});

/* Keyboard shortcuts live on the CONTROLLER (that's where marking happens now): C = correct, I = incorrect */
document.addEventListener('keydown', function(e){
  if (role !== 'controller' || !CTRL.state) return;
  if (e.repeat) return; // ignore OS key-repeat while held, to avoid double-marking
  var tag = (document.activeElement && document.activeElement.tagName) || '';
  if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT') return;
  var key = e.key ? e.key.toLowerCase() : '';
  if (key !== 'c' && key !== 'i') return;
  var s = CTRL.state;
  if (s.phase === 'playing' && s.currentQuestion){
    e.preventDefault();
    if (key === 'c') Actions.ctrlMarkCorrect(); else Actions.ctrlMarkIncorrect();
  } else if (s.phase === 'shootout' && s.shootout && s.shootout.currentQuestion){
    e.preventDefault();
    Actions.ctrlShootoutMark(key === 'c' ? 'correct' : 'incorrect');
  }
});

/* Auto-rejoin: if this tab already had a player session (e.g. the page was refreshed),
   reconnect automatically instead of dropping back to the landing screen. Otherwise, if the
   page was opened via a shared invite link (?join=CODE), jump straight to the join form
   with the room code already filled in. */
(function init(){
  var sess = getPlayerSession();
  if (sess && sess.roomCode && sess.name){
    connectPlayerToHost(sess.roomCode, sess.name);
    return;
  }
  var joinCode = getQueryParam('join');
  if (joinCode){
    localView = 'playerSetup';
    pendingJoinCode = joinCode.toUpperCase().replace(/[^A-Z]/g,'').slice(0,4);
  }
  render();
})();
})();
</script>
